name: 학습노트 제출 현황 갱신

on:
  push:
    branches:
      - main
    paths:
      - "w*/학습노트/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-submission-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: README 제출 현황 갱신
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 최신 main 동기화
        run: git pull --ff-only origin main

      - name: 제출 현황 생성
        run: node .github/scripts/update-submission-status.mjs

      - name: README 커밋 및 푸시
        run: |
          if git diff --quiet -- README.md; then
            echo "README 제출 현황이 최신입니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 학습노트 제출 현황 갱신"
          git push origin HEAD:main
